[project]
name = "python-daily"
version = "0.1.0"
description = "Daily Python practice with automated senior-level review"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["days"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: imports, B: bugbear, UP: modern syntax, SIM: simplifications,
# C4: comprehensions, RET: returns, PL: pylint subset, RUF: ruff-specific
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PL", "RUF"]
ignore = ["PLR2004"]  # magic numbers are fine in tests

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# Tests deliberately misuse the API; whether an ignore is needed depends on how you type it.
module = "days.*.test_solution"
warn_unused_ignores = false
